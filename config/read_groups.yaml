# Optional per-sample read-group metadata.
#
# Enable this in config/config.yaml:
# read_groups:
#   enabled: true
#   metadata_file: "config/read_groups.yaml"
#
# Sample keys must match FASTQ sample names after removing "_R1_001.fastq.gz".
# Leave enabled: false to use the workflow fallback:
# ID=<sample>, SM=<sample>, LB=lib1, PL=ILLUMINA, PU=unit1

samples:
  ExampleSample:
    ID: "ExampleSample"
    SM: "ExampleSample"
    LB: "library1"
    PL: "ILLUMINA"
    PU: "flowcell.lane.barcode"
    CN: "sequencing_center"
    DT: "2026-01-01"
