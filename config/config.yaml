input_dir: "."
output_dir: "results"

references:
  bed_file: "regions.bed"
  known_sites: "./Mills_and_1000G_gold_standard.indels.b37.vcf"
  ref: "./GRCh37.p13.genome.fa"
  bwa_index: "./GRCh37.p13.genome.fa"
  vep_cache: "./VEP_data"
  pseudogene_bed: "./pseudogenes_37.bed"

filter_thresholds:
  DP: 30
  GQ: 99

gatk_hard_filters:
  snps:
    QD_min: 2.0
    FS_max: 60.0
    SOR_max: 3.0
    MQ_min: 40.0
    MQRankSum_min: -12.5
    ReadPosRankSum_min: -8.0
  indels:
    QD_min: 2.0
    FS_max: 200.0
    SOR_max: 10.0
    ReadPosRankSum_min: -20.0

resources:
  gatk_mem_mb: 32000
  tmpdir: "/tmp"

containers:
  fastp: "docker://quay.io/biocontainers/fastp:0.24.0--heae3180_1"
  bwa: "docker://quay.io/biocontainers/bwa:0.7.19--h577a1d6_1"
  samtools: "docker://quay.io/biocontainers/samtools:1.22.1--h96c455f_0"
  gatk4: "docker://quay.io/biocontainers/gatk4:4.6.2.0--py310hdfd78af_0"
  bcftools: "docker://quay.io/biocontainers/bcftools:1.22--h3a4d415_1"
  freebayes: "docker://quay.io/biocontainers/freebayes:1.3.10--hbefcdb2_0"
  vep: "docker://quay.io/biocontainers/ensembl-vep:115.2--pl5321h2a3209d_1"
  python: "docker://python:3.11-slim"

postprocess:
  variant_summary: "./variant_summary.txt"
  coverage_dir: "reports/coverage"
  report_dir: "reports"
  qc_min_30x: 30
  positive_control_min_30x: 30
  ntc_max_30x: 1
